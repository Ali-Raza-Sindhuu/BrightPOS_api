name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: brightpos_migration_test
          MYSQL_USER: brightpos_ci
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: brightpos_ci
      DB_PASSWORD: ci-database-password
      DB_NAME: brightpos_migration_test
      DB_SSL: false
      JWT_SECRET: ci-only-unique-signing-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Initialize only disposable CI fixtures
        run: >-
          docker exec -e MYSQL_PWD=ci-root-password ${{ job.services.mysql.id }}
          mysql -uroot -e
          "SET GLOBAL log_bin_trust_function_creators=1;
          CREATE DATABASE brightpos_migration_failure CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE brightpos_migration_history CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL ON brightpos_migration_failure.* TO 'brightpos_ci'@'%';
          GRANT ALL ON brightpos_migration_history.* TO 'brightpos_ci'@'%';"
      - run: npm run check:code
      - run: npm test
      - run: npm run test:db
      - run: npm run test:counter
      - run: npm run test:backend
